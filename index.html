<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check the weather in any city around the world" />
    <link rel="icon" href="./public/assets/cloud.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>Check The Clouds - Weather App</title>
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <h1 class="header-title">
            <span class="weather-icon" aria-hidden="true">☁️</span>
            Check The Clouds
          </h1>
          <p class="header-subtitle">Discover the weather in any city around the world</p>
        </div>
      </header>

      <main class="main-content">
        <!-- Alert Container -->
        <div class="alert-container" role="alert" aria-live="polite">
          <div class="alert-box hide">
            <span class="alert-icon" aria-hidden="true">⚠️</span>
            <p class="alert-box_text"></p>
          </div>
        </div>

        <!-- Search Form -->
        <form class="search-form" role="search">
          <div class="search-wrapper">
            <label for="City" class="visually-hidden">Enter city name</label>
            <div class="input-wrapper">
              <span class="search-icon" aria-hidden="true">🔍</span>
              <input
                class="search-input"
                type="text"
                id="City"
                name="city"
                placeholder="Enter a city name..."
                required
                autocomplete="off"
                aria-label="Search for a city"
              />
            </div>
            <button type="submit" class="search-btn btn" aria-label="Search weather">
              <span class="btn-text">Search</span>
              <span class="btn-icon" aria-hidden="true">→</span>
            </button>
          </div>
        </form>

        <!-- Weather Results -->
        <section class="hide display-weather weather-card" aria-label="Weather information">
          <div class="weather-header">
            <div class="location-info">
              <h2 class="city"></h2>
              <div class="country-flag">
                <img class="flag" alt="Country flag" src="https://flagsapi.com/IT/flat/64.png" loading="lazy" />
              </div>
            </div>
            <div class="weather-main">
              <img class="icon-img icon" alt="Weather condition icon" src="" loading="lazy" />
              <p class="weatherDescription"></p>
            </div>
          </div>

          <div class="weather-grid grid">
            <article class="weather-item item-container">
              <div class="item-icon" aria-hidden="true">🌡️</div>
              <div class="item-content">
                <span class="item-label">Temperature</span>
                <span class="item-value temperature"></span>
              </div>
            </article>

            <article class="weather-item item-container">
              <div class="item-icon" aria-hidden="true">💧</div>
              <div class="item-content">
                <span class="item-label">Humidity</span>
                <span class="item-value humidity"></span>
              </div>
            </article>

            <article class="weather-item item-container">
              <div class="item-icon" aria-hidden="true">💨</div>
              <div class="item-content">
                <span class="item-label">Wind Speed</span>
                <span class="item-value wind"></span>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>Data provided by <a href="https://openweathermap.org/" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
